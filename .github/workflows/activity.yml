name: Fill Activity Graph

on:
  schedule:
    - cron: '0 12 * * *' # Запуск раз в день
  workflow_dispatch:

jobs:
  single-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: bcanseco/github-contribution-graph-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_EMAIL: твой_email@example.com # 👈 ОБЯЗАТЕЛЬНО замени на email из настроек GitHub
